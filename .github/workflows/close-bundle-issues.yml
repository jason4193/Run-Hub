name: Close Bundle Sub-Issues

# GitHub honours closing keywords only on PRs into the default branch, so a merge into a bundle closes them here.
on:
  pull_request:
    types: [closed]
    branches: ["feature/**"]

permissions:
  issues: write

jobs:
  close-issues:
    name: Close Named Issues
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close Issues Named By Closing Keywords
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          numbers=$(printf '%s' "$PR_BODY" \
            | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+\b' \
            | grep -oE '[0-9]+$' | sort -un || true)
          for n in $numbers; do
            state=$(gh issue view "$n" --json state -q .state 2>/dev/null || echo MISSING)
            if [ "$state" = "OPEN" ]; then
              gh issue close "$n" --reason completed --comment "Closed by #$PR_NUMBER, merged into \`$BASE_REF\`."
            else
              echo "#$n is $state, skipped"
            fi
          done
